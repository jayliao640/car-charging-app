<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>汽車充電紀錄 App</title>
  <style>
    :root{
      --bg:#f5f7fb; --card:#ffffff; --primary:#1f4e78; --accent:#2f75b5;
      --green:#2e7d32; --danger:#c62828; --text:#1f2937; --muted:#6b7280; --border:#dbe3ee;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Microsoft JhengHei",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:960px;margin:auto;padding:18px}
    header{background:linear-gradient(135deg,var(--primary),var(--accent));color:white;padding:22px;border-radius:18px;box-shadow:0 10px 30px rgba(31,78,120,.22)}
    header h1{margin:0 0 6px;font-size:28px}
    header p{margin:0;opacity:.9}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
    .stat .label{font-size:14px;color:var(--muted)}
    .stat .value{font-size:26px;font-weight:700;margin-top:8px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-top:14px}
    .card h2{margin:0 0 14px;font-size:20px}
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
    input,textarea,button{font:inherit}
    input,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:white}
    input:focus,textarea:focus{outline:2px solid rgba(47,117,181,.2);border-color:var(--accent)}
    .preview{margin-top:8px;max-width:260px;border-radius:12px;display:none;border:1px solid var(--border)}
    .calc{background:#eef6ff;border:1px solid #c9def4;border-radius:12px;padding:14px;margin-top:12px}
    .calc strong{font-size:22px;color:var(--primary)}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}
    .primary{background:var(--primary);color:white}
    .secondary{background:#e8eef5;color:var(--text)}
    .danger{background:#fdecec;color:var(--danger)}
    .filter{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:left;font-size:14px}
    th{background:#f8fafc}
    .thumb{width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
    .empty{text-align:center;color:var(--muted);padding:28px}
    .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf7ee;color:var(--green);font-weight:700}
    .note{font-size:13px;color:var(--muted);line-height:1.6}
    @media(max-width:700px){
      .grid{grid-template-columns:1fr}
      .form-grid,.filter{grid-template-columns:1fr}
      table{display:block;overflow-x:auto;white-space:nowrap}
    }
  </style>

  <meta name="theme-color" content="#1f4e78">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

</head>
<body>
  <div class="app">
    <header>
      <h1>汽車充電紀錄</h1>
      <p>電池容量 22 kWh｜每 1% = 0.22 kWh｜每次充至 100%</p><div class="actions"><button class="secondary" id="installBtn" style="display:none">安裝到手機</button></div>
    </header>

    <section class="grid">
      <div class="stat"><div class="label">目前區間充電次數</div><div class="value" id="countStat">0 次</div></div>
      <div class="stat"><div class="label">目前區間總充電量</div><div class="value" id="kwhStat">0.00 kWh</div></div>
      <div class="stat"><div class="label">平均每次充電量</div><div class="value" id="avgStat">0.00 kWh</div></div>
    </section>

    <section class="card">
      <h2>新增充電紀錄</h2>
      <div class="form-grid">
        <div>
          <label for="date">充電日期</label>
          <input type="date" id="date">
        </div>
        <div>
          <label for="soc">充電前剩餘電量（%）</label>
          <input type="number" id="soc" min="0" max="100" step="1" placeholder="例如：35">
        </div>
        <div>
          <label for="photo">儀表照片（選填）</label>
          <input type="file" id="photo" accept="image/*">
          <img id="preview" class="preview" alt="照片預覽">
        </div>
      </div>
      <div>
        <label for="note">備註（選填）</label>
        <textarea id="note" rows="2" placeholder="例如：住家充電、充滿"></textarea>
      </div>
      <div class="calc">
        本次預估充電量：<strong id="calcKwh">0.00 kWh</strong>
        <div class="note">公式：（100 − 充電前電量%）× 0.22 kWh</div>
      </div>
      <div class="actions">
        <button class="primary" id="saveBtn">儲存紀錄</button>
        <button class="secondary" id="resetBtn">清除輸入</button>
      </div>
    </section>

    <section class="card">
      <h2>日期區間統計</h2>
      <div class="filter">
        <div>
          <label for="startDate">開始日期</label>
          <input type="date" id="startDate">
        </div>
        <div>
          <label for="endDate">結束日期</label>
          <input type="date" id="endDate">
        </div>
        <button class="primary" id="filterBtn">套用區間</button>
      </div>
      <div class="actions">
        <button class="secondary" id="thisMonthBtn">本月</button>
        <button class="secondary" id="allBtn">全部紀錄</button>
        <button class="secondary" id="exportBtn">匯出 CSV</button>
      </div>

      <div id="tableWrap"></div>
    </section>

    <section class="card">
      <div class="note">
        照片為選填，可直接拍照或從相簿選擇；未上傳照片也可以儲存。資料會儲存在目前瀏覽器的 localStorage。若清除瀏覽器資料、換手機或換瀏覽器，紀錄不會自動同步。
        正式上線時可改接 Google Sheets、Firebase 或 AppSheet。
      </div>
    </section>
  </div>

  <script>
    const BATTERY_KWH = 22;
    const KWH_PER_PERCENT = BATTERY_KWH / 100;
    const STORAGE_KEY = "carChargingRecordsV1";
    let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let currentPhoto = "";

    const $ = id => document.getElementById(id);
    const today = new Date().toISOString().slice(0,10);
    $("date").value = today;

    function calcKwh(soc){
      const n = Number(soc);
      if(Number.isNaN(n) || n < 0 || n > 100) return 0;
      return (100 - n) * KWH_PER_PERCENT;
    }

    $("soc").addEventListener("input", () => {
      $("calcKwh").textContent = calcKwh($("soc").value).toFixed(2) + " kWh";
    });

    $("photo").addEventListener("change", e => {
      const file = e.target.files[0];
      if(!file){ currentPhoto=""; $("preview").style.display="none"; return; }
      const reader = new FileReader();
      reader.onload = ev => {
        currentPhoto = ev.target.result;
        $("preview").src = currentPhoto;
        $("preview").style.display = "block";
      };
      reader.readAsDataURL(file);
    });

    function resetForm(){
      $("date").value = today;
      $("soc").value = "";
      $("note").value = "";
      $("photo").value = "";
      currentPhoto = "";
      $("preview").style.display = "none";
      $("calcKwh").textContent = "0.00 kWh";
    }

    $("resetBtn").addEventListener("click", resetForm);

    $("saveBtn").addEventListener("click", () => {
      const date = $("date").value;
      const soc = Number($("soc").value);
      if(!date) return alert("請選擇充電日期");
      if(Number.isNaN(soc) || soc < 0 || soc > 100) return alert("請輸入 0～100 的剩餘電量");

      const rec = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        date,
        soc,
        kwh: Number(calcKwh(soc).toFixed(2)),
        note: $("note").value.trim(),
        photo: currentPhoto,
        createdAt: new Date().toISOString()
      };
      records.unshift(rec);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      resetForm();
      setThisMonth();
      alert("已儲存");
    });

    function getFiltered(){
      const start = $("startDate").value;
      const end = $("endDate").value;
      return records.filter(r => (!start || r.date >= start) && (!end || r.date <= end));
    }

    function render(){
      const list = getFiltered();
      const total = list.reduce((s,r)=>s+Number(r.kwh||0),0);
      $("countStat").textContent = list.length + " 次";
      $("kwhStat").textContent = total.toFixed(2) + " kWh";
      $("avgStat").textContent = (list.length ? total/list.length : 0).toFixed(2) + " kWh";

      if(!list.length){
        $("tableWrap").innerHTML = '<div class="empty">此日期區間尚無充電紀錄</div>';
        return;
      }
      $("tableWrap").innerHTML = `
        <table>
          <thead><tr>
            <th>日期</th><th>充電前</th><th>充電量</th><th>照片</th><th>備註</th><th>操作</th>
          </tr></thead>
          <tbody>
            ${list.map(r=>`
              <tr>
                <td>${r.date}</td>
                <td><span class="pill">${r.soc}%</span></td>
                <td><strong>${Number(r.kwh).toFixed(2)} kWh</strong></td>
                <td>${r.photo ? `<a href="${r.photo}" target="_blank"><img class="thumb" src="${r.photo}" alt="儀表照片"></a>` : "-"}</td>
                <td>${escapeHtml(r.note || "-")}</td>
                <td><button class="danger" onclick="deleteRecord('${r.id}')">刪除</button></td>
              </tr>`).join("")}
          </tbody>
        </table>`;
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
    }

    window.deleteRecord = function(id){
      if(!confirm("確定刪除此筆紀錄？")) return;
      records = records.filter(r=>r.id!==id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      render();
    }

    function setThisMonth(){
      const now = new Date();
      const y = now.getFullYear(), m = now.getMonth();
      const first = new Date(y,m,1);
      const last = new Date(y,m+1,0);
      const fmt = d => d.toISOString().slice(0,10);
      $("startDate").value = fmt(first);
      $("endDate").value = fmt(last);
      render();
    }

    $("filterBtn").addEventListener("click", render);
    $("thisMonthBtn").addEventListener("click", setThisMonth);
    $("allBtn").addEventListener("click", ()=>{
      $("startDate").value = "";
      $("endDate").value = "";
      render();
    });

    $("exportBtn").addEventListener("click", ()=>{
      const list = getFiltered();
      const rows = [["日期","充電前電量(%)","充電量(kWh)","備註"]];
      list.forEach(r=>rows.push([r.date,r.soc,r.kwh,r.note]));
      const csv = "\uFEFF" + rows.map(row => row.map(v => `"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
      const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href=url; a.download="汽車充電紀錄.csv"; a.click();
      URL.revokeObjectURL(url);
    });

    setThisMonth();
  
    let deferredPrompt = null;
    const installBtn = document.getElementById("installBtn");

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "inline-block";
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    window.addEventListener("appinstalled", () => {
      installBtn.style.display = "none";
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js");
      });
    }

</script>
</body>
</html>
